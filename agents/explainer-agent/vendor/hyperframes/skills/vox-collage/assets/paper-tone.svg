<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Large, soft unevenness of real paper (blotches, slight fibre clouds). Overlay with multiply at low opacity. -->
  <filter id="t" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="4" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.46  0 0 0 0 0.43  0 0 0 0 0.36  0.6 0 0 0 -0.24"/>
  </filter>
  <rect width="1200" height="1200" filter="url(#t)"/>
</svg>
