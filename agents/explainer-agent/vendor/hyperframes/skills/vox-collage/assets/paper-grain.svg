<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Fine paper tooth: dark speckles with alpha, tileable. Overlay with mix-blend-mode: multiply. -->
  <filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.106  0 0 0 0 0.106  0 0 0 0 0.094  1.3 0 0 0 -0.56"/>
  </filter>
  <rect width="480" height="480" filter="url(#g)"/>
</svg>
