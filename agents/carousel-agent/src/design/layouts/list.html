<!--
layout: list
for: what's included, the agenda, the options, the features: 4–8 short items
needs: nothing
notes: items ≤ 4 words with matching icons; icon-list--rows (divided rows, one column) for 4–6 items, two plain columns (--cols:2) for 6–8; the list sits in the middle (my-auto), the CTA at the bottom
-->
<section class="slide">
  <p class="kicker">Five sessions, one month</p>
  <h2 class="h1" style="margin-top:20px">Pick what you<br>need this month</h2>
  <div class="icon-list icon-list--rows my-auto" style="--cols:1">
    <span class="icon-list__item"><i class="icon icon--search"></i>Research basics</span>
    <span class="icon-list__item"><i class="icon icon--doc"></i>Writing specs</span>
    <span class="icon-list__item"><i class="icon icon--flag"></i>Roadmaps</span>
    <span class="icon-list__item"><i class="icon icon--chart"></i>Metrics</span>
    <span class="icon-list__item"><i class="icon icon--compass"></i>Discovery</span>
  </div>
  <a class="cta cta--arrow">See the sessions</a>
</section>
