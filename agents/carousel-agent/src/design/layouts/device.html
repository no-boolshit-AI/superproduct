<!--
layout: device
for: a cover or single post showing a moment, a session or a product on a laptop (or phone) screen
needs: a photo or screenshot for the screen (the user's asset, or a generated "photo"); or a full .ui mock inside the screen (a ui-bar, then 4–6 rows that fill it)
notes: headline above, one closing line below; the device sits in the middle (my-auto); at most one sticker, pinned to the device's edge or corner inside the .anchor, never over UI content or text
-->
<section class="slide">

    <div class="device device--laptop device--tilt">
      <div class="device__screen"><img src="assets/photo.jpg" alt=""></div>
    </div>
    <span class="sticker sticker--accent sticker--float" style="right:-12px;top:42%;--tilt:-5deg">Swipe for more <i class="icon icon--arrow-right"></i></span>
  </div>
  <h2 class="h2">Join the spring cohort</h2>
</section>
