<!--
layout: card-people
for: a track, team, cohort or speaker line-up: what it is, who runs it, one action
needs: the people's real photos from the user (--asset), else .avatar--initials. Never generated faces.
notes: 1–2 stickers; the panel holds a kicker, a title and 1–2 sentences; the CTA overlaps its bottom edge (both inside the .anchor, which sits in the middle); 2–4 people at the bottom
-->
<section class="slide slide--light">
  <div class="watermark watermark--logo"></div>
  <div class="row between row--top">
    <div class="wordmark wordmark--inline"></div>
    <div class="stickers stickers--right">
      <span class="sticker" style="--tilt:-4deg">Now open</span>
      <span class="sticker sticker--2" style="--tilt:-1deg">Peer circle</span>
    </div>
  </div>
  <div class="anchor my-auto">
    <div class="panel">
      <p class="kicker">Track 2</p>
      <h2 class="h1">Research ops</h2>
      <p class="body">Six weeks of interviews, synthesis and decisions, practised on your own product.</p>
    </div>
    <a class="cta cta--arrow cta--overlap">Join the track</a>
  </div>
  <p class="kicker">Your hosts</p>
  <div class="people people--sm" style="margin-top:20px">
    <div class="person"><div class="avatar"><img src="assets/avatar-1.jpg" alt=""></div><p class="person__name">Ioana<br>Marin</p></div>
    <div class="person"><div class="avatar"><img src="assets/avatar-2.jpg" alt=""></div><p class="person__name">Dan<br>Petrescu</p></div>
    <div class="person"><div class="avatar avatar--initials">RC</div><p class="person__name">Radu<br>Costin</p></div>
  </div>
</section>
