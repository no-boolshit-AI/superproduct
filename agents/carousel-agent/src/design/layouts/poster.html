<!--
layout: poster
for: a cover or single post announcing an event, a call, a programme or an offer
needs: no image; stickers, a meta row with icons, an icon list (optional: the logo watermark)
notes: hook 2–4 words on 2 lines; 3 meta items; 4–6 list items ≤ 4 words in two columns; the band sits behind the list
-->
<section class="slide">
  <div class="watermark watermark--logo"></div>
  <div class="band"></div>
  <div class="row between row--top">
    <div class="stickers">
      <span class="sticker sticker--ink" style="--tilt:-5deg">The open</span>
      <span class="sticker" style="--tilt:-2deg">Studio season</span>
    </div>
    <div class="wordmark wordmark--inline"></div>
  </div>
  <div class="meta" style="margin-top:48px">
    <span class="meta__item"><i class="icon icon--calendar"></i>Oct–Nov 2026</span>
    <span class="meta__item"><i class="icon icon--hourglass"></i>2–4h each</span>
    <span class="meta__item"><i class="icon icon--monitor"></i>Online &amp; on site</span>
  </div>
  <h1 class="hero" style="margin-top:32px">Call for<br>speakers</h1>
  <p class="lead" style="margin-top:16px">Share what you learned the hard way.</p>
  <div class="stack stack--sm mt-auto">
    <p class="kicker">Topics we want</p>
    <div class="icon-list" style="--cols:2">
      <span class="icon-list__item"><i class="icon icon--search"></i>Research in practice</span>
      <span class="icon-list__item"><i class="icon icon--chart"></i>Metrics that matter</span>
      <span class="icon-list__item"><i class="icon icon--pen"></i>Writing specs</span>
      <span class="icon-list__item"><i class="icon icon--compass"></i>Pricing calls</span>
    </div>
  </div>
</section>
