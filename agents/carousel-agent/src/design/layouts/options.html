<!--
layout: options
for: the options to pick from, the tracks, the features or what's included: 2–4 items, each a short title and one line
needs: nothing (an icon per item, or a number in the icon tile)
notes: titles ≤ 4 words, lines ≤ 12 words; cards--list stacks full-width rows (3–4 items), cards with --n:2 make a 2×2 grid; at most one sticker, pinned to the list's corner inside the .anchor
-->
<section class="slide">
  <div class="watermark watermark--logo"></div>
  <div class="wordmark wordmark--top"></div>
  <h2 class="h1">Pick one track</h2>
  <div class="anchor my-auto">
    <div class="cards cards--list">
      <div class="card"><span class="card__icon"><i class="icon icon--search"></i></span><p class="card__title">Research ops</p><p class="card__text">Interviews and synthesis, on your product.</p></div>
      <div class="card"><span class="card__icon"><i class="icon icon--chart"></i></span><p class="card__title">Metrics</p><p class="card__text">Three numbers and one weekly review.</p></div>
      <div class="card"><span class="card__icon"><i class="icon icon--pen"></i></span><p class="card__title">Writing specs</p><p class="card__text">One page the whole team signs off.</p></div>
    </div>
    <span class="sticker sticker--float" style="right:-12px;top:-36px;--tilt:4deg">Pick one</span>
  </div>
</section>
