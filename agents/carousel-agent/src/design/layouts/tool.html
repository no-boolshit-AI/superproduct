<!--
layout: tool
for: one tool or integration per slide in a roundup, centred, with its website and how to connect
needs: the tool's screenshot from the user (--asset); its logo in the chip (user asset) or a line icon
notes: chip = icon + name; one sentence with a .hl phrase; a tag + one line of detail; progress shows the position
-->
<section class="slide text-center">
  <div class="fx-paper"></div>
  <div class="chip" style="margin-top:56px"><span class="app-icon"><i class="icon icon--sparkle"></i></span>Orbit</div>
  <p class="body-lg" style="margin-top:40px">Collects feedback from every channel and sends <span class="hl">the urgent bits to your team</span>.</p>
  <div class="window" data-url="orbit.example" style="margin-top:40px;height:330px"><img src="assets/screen.jpg" alt=""></div>
  <div class="row center" style="margin-top:36px;--gap:28px"><span class="tag">Feedback</span><span class="body muted">Free plan · orbit.example</span></div>
  <div class="progress" style="--at:1;--of:6"></div>
  <div class="next"></div>
</section>
