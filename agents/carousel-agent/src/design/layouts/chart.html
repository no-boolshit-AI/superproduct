<!--
layout: chart
for: one comparison or ranking from the brief's data
needs: numbers from the brief (never invented) and their source
notes: 3–5 bars with values scaled to 0–100 in --v; the message bar first; the bars and the takeaway sit in the middle (my-auto); a source line at the bottom
-->
<section class="slide">
  <p class="kicker">Where the week goes</p>
  <h2 class="h1" style="margin-top:20px">Reporting eats<br>a day a week</h2>
  <div class="stack stack--lg my-auto">
    <div class="bars" style="--label-w:300px">
      <div class="bar" style="--v:80"><span class="bar__label">Status reports</span><span class="bar__track"></span><span class="bar__value">8 h</span></div>
      <div class="bar bar--muted" style="--v:50"><span class="bar__label">Meetings</span><span class="bar__track"></span><span class="bar__value">5 h</span></div>
      <div class="bar bar--muted" style="--v:30"><span class="bar__label">Planning</span><span class="bar__track"></span><span class="bar__value">3 h</span></div>
    </div>
    <p class="body-lg">Automating the report gives that day back to the work.</p>
  </div>
  <p class="source">Source: example data</p>
</section>
