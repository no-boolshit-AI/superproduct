for: one tool, feature or resource per slide in a roundup or tour, left-aligned
needs: the tool's screenshot from the user (--asset) in the window, else a .ui mock; its icon (user asset) or a line icon

-->

  <div class="window window--bare grow" style="margin-top:40px;margin-bottom:56px"><img src="assets/screen.jpg" alt=""></div>
