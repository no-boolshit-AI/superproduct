<!--
layout: texture
for: a one-line poster: a role you are hiring for, a place, a date, a short announcement; works as a single post
needs: a generated image of a few floating objects (style "3d-mono" or "abstract"); it is duotoned into the brand colour
notes: ≤ 3 words top-left, ≤ 2 words bottom-right; nothing else
-->
<section class="slide slide--brand">
  <div class="bg bg--duotone"><img src="assets/objects.jpg" alt=""></div>
  <div class="fx-holo"></div>
  <div class="fx-stipple"></div>
  <div class="frame frame--holo"></div>
  <p class="h1 row" style="--gap:20px"><i class="icon icon--sparkle" style="--icon:64px"></i>Design lead</p>
  <p class="hero text-right mt-auto">Remote</p>
</section>
