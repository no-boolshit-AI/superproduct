<!doctype html>
<!--
LAYOUT 03 · STATEMENT + GHOST — use for: the core claim / a hard-hitting statement.
COPY   .hl   big serif statement, 10–18 words, max 5 lines.
       .dek  1 short paragraph, 14–24 words, lower right.
IMAGES 1 texture/object image (NO text, NO logos), shown huge, tilted and faded behind.
       e.g. a pile of objects, hands, screens, crowds, paper, machinery.
       generate_image kind=texture aspect=square|landscape.
       Classes: .img .ghost .duo-ghost  (or no duo class to keep faint original colour).
-->
<html lang="en" data-palette="orchid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statement + ghost</title>
<link rel="stylesheet" href="_design/collage.css">
<script src="_design/collage.js" defer></script>
</head>
<body>
<main class="canvas L-statement grain">
  <p class="mast">Your Brand</p>
  <h1 class="txt hl" data-fit data-min="70">A feed can tell you what is popular. It cannot tell you what matters.</h1>
  <img class="img ghost duo-ghost" src="assets/sample-texture.jpg" alt="">
  <p class="txt body dek">Ranking systems reward what gets clicked, not what gets checked. The checking is still our job.</p>
</main>
</body>
</html>
