<!doctype html>
<!--
LAYOUT 01 · COVER PORTRAIT — use for: slide 1 / hook / single-post hero.
COPY   .dek  small sans, 10–22 words, top-right.
       .hl   giant serif, 3–7 words, 2–4 short lines (use <br> for the rhythm).
IMAGES 1 full-bleed image, 4:5. Portrait, face/subject in the upper-middle third,
       lots of dark space at the bottom for the headline.
       generate_image kind=scene|portrait aspect=cover  — or a public-domain painting/photo.
       Classes: .img .duo-hero (dark tritone). Optional .punch for more contrast.
-->
<html lang="en" data-palette="orchid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover portrait</title>
<link rel="stylesheet" href="_design/collage.css">
<script src="_design/collage.js" defer></script>
</head>
<body>
<main class="canvas L-cover grain">
  <img class="img hero duo-hero punch" src="assets/sample-portrait.jpg" alt="">
  <div class="vignette"></div>
  <div class="fade"></div>
  <p class="mast">Your Brand</p>
  <p class="txt body dek">Curiosity is not a personality trait. It is a habit you can practise, share and protect.</p>
  <h1 class="txt hl" data-fit data-min="84">Why<br>we still<br>need<br>explorers.</h1>
</main>
</body>
</html>
