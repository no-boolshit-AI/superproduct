<!doctype html>
<!--
LAYOUT 02 · DIAGONAL QUESTION — use for: a provocative question, a turn in the argument.
COPY   .stair  the question, 3–5 words, 3 rows max. Wrap EVERY word in <span class="w">…</span>
               and use <br> between rows (1–2 short words per row, the longest word alone on the last row).
               End with the question mark inside the last word: <span class="w">curious<span class="q">?</span></span>.
       .dek    1–2 short paragraphs (<p>), 25–40 words total, top-right.
       .cap    1 sentence, 12–22 words, bottom-left; underline the key idea with <u>.
IMAGES 1 transparent cutout (head & shoulders / half figure), subject looking LEFT or down-left,
       bleeding off the bottom-right corner.
       generate_image kind=cutout aspect=portrait.
       Classes: .img .cut .duo-cut .edge-loud (outline from the loud colour).
-->
<html lang="en" data-palette="orchid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagonal question</title>
<link rel="stylesheet" href="_design/collage.css">
<script src="_design/collage.js" defer></script>
</head>
<body>
<main class="canvas L-diagonal grain">
  <p class="mast">Your Brand</p>
  <div class="txt body dek">
    <p>Feeds are built to give us more of what we already like. Every scroll narrows the map a little.</p>
    <p>Exploring means choosing the path nobody recommended.</p>
  </div>
  <h1 class="txt hl stair" data-fit="height" data-min="70"><span class="w">Are</span> <span class="w">you</span><br><span class="w">still</span><br><span class="w">curious<span class="q">?</span></span></h1>
  <img class="img cut duo-cut edge-loud" src="assets/sample-cutout.png" alt="">
  <p class="txt body cap">The questions nobody suggested to you are often the ones <u>worth asking first</u>.</p>
</main>
</body>
</html>
