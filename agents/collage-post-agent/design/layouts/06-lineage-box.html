<!doctype html>
<!--
LAYOUT 06 · LINEAGE BOX — the LOUD slide. Use once per carousel: a list of 3–4 traits,
principles, steps or "what they had in common", framed as an open drawer.
COPY   .box b1–b3 (above the band) and b4 (below): 4–9 words each, parallel phrasing.
       .band .hl : title, 2–4 words, single line.
IMAGES 4–7 small portraits/objects on ink squares (cards c1–c7; c5–c7 sink behind the band).
       Best: public-domain portraits of real people (find_public_domain_image) or
       generate_image kind=cutout (engraving/photo of an archetype).
       Classes: .img (+ .contain for transparent cutouts). They are multiplied onto the ink square.
       Remove unused cards rather than leaving empty squares (keep at least 4).
-->
<html lang="en" data-palette="orchid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineage box</title>
<link rel="stylesheet" href="_design/collage.css">
<script src="_design/collage.js" defer></script>
</head>
<body>
<main class="canvas L-lineage grain">
  <p class="mast">Your Brand</p>
  <div class="sq s1"></div><div class="sq s2"></div><div class="sq s3"></div><div class="sq s4"></div>
  <div class="frame-line outer"></div>
  <svg class="flaps" viewBox="0 0 1080 1350" aria-hidden="true"><line x1="266" y1="776" x2="60" y2="840"/><line x1="821" y1="620" x2="1020" y2="840"/></svg>
  <div class="txt box b1">They asked questions before they had answers</div>
  <div class="txt box b2">They connected ideas across different fields</div>
  <div class="txt box b3">They tested claims instead of repeating them</div>
  <div class="card c1"><img class="img" src="assets/sample-portrait.jpg" alt=""></div>
  <div class="card c2"><img class="img" src="assets/sample-cutout.png" alt=""></div>
  <div class="card c3"><img class="img" src="assets/sample-portrait.jpg" alt=""></div>
  <div class="card c4"><img class="img" src="assets/sample-cutout.png" alt=""></div>
  <div class="card c5"><img class="img" src="assets/sample-portrait.jpg" alt=""></div>
  <div class="card c6"><img class="img" src="assets/sample-cutout.png" alt=""></div>
  <div class="card c7"><img class="img" src="assets/sample-portrait.jpg" alt=""></div>
  <div class="band"><h2 class="hl" data-fit data-min="64">Habits of explorers</h2></div>
  <div class="txt box b4">They shared findings so others could go further</div>
</main>
</body>
</html>
