<!doctype html>
<html lang="en">
<head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="sp-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 0.22" result="grey"/>
      <feComposite in="grey" in2="SourceGraphic" operator="in"/>
    </filter>
  </svg>

  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="superproduct home">
        <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="14" fill="none" stroke="#C9DD32" stroke-width="3.2"/>
          <path d="M17 8.5l2.2 6.3 6.3 2.2-6.3 2.2L17 25.5l-2.2-6.3L8.5 17l6.3-2.2z" fill="#1E1D1A"/>
        </svg>
        <span class="brand-name">superproduct</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/work" data-nav="work">Work</a>
        <a href="#/files" data-nav="files">Files</a>
        <a href="#/agents" data-nav="agents">Agents</a>
        <a href="#/knowledge" data-nav="knowledge">Knowledge</a>
      </nav>
      <div class="topbar-actions">
        <a class="btn btn-outline" href="#/setup" data-nav="setup"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Setup</span></a>
        <button class="btn btn-lime nav-new" type="button" data-action="new-request">New request</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading"><span class="spinner"></span> Reading your workspace…</div>
  </main>

  <div id="layer"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
